[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolvable-medical-agent-benchmark"
version = "0.1.0"
description = "Reference-neutral protocol tools for autonomous, sealed, versioned medical-agent evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Wenjie Chen"}]
dependencies = []

[project.scripts]
emab = "emab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

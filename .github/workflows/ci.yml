name: protocol-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run protocol tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check public release boundary
        run: python scripts/release_boundary_check.py
      - name: Validate mechanical conformance fixture
        env:
          PYTHONPATH: src
        run: python -m emab validate examples/mechanical-conformance
